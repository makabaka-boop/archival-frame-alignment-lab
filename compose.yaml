services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: film
      POSTGRES_PASSWORD: film
      POSTGRES_DB: film
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film -d film"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql://film:film@db:5432/film
      API_PORT: "${API_PORT:-8000}"
    # API_PORT exposes the service on the host; uvicorn itself listens on 8000
    # inside the container.
    command:
      - sh
      - -c
      - "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Acceptance suite: exhaustive brute-force cross-checks on small cases plus
  # the large-input timing/anchoring scenarios. Run with:
  #   docker compose run --rm verify
  verify:
    build:
      context: .
      target: verify
    environment:
      BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    profiles: ["verify"]

volumes:
  pgdata:
